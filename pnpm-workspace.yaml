# Approve the install scripts pnpm 11 blocks by default: host's optional
# binaries (ffmpeg/ffprobe/7-Zip) and lefthook's platform binary.
allowBuilds:
  '@hoardodile/ffmpeg-bin': true
  '@hoardodile/ffprobe-bin': true
  '@hoardodile/7z-bin': true
  'lefthook': true
minimumReleaseAgeExclude:
  - '@hoardodile/cli@0.2.0'
  - '@hoardodile/host@0.2.0'
  - '@hoardodile/i18n@0.2.0'
  - '@hoardodile/sdk-react@0.2.0'
  - '@hoardodile/sdk-server@0.2.0'
  - '@hoardodile/sdk-types@0.2.0'
  - '@hoardodile/sdk-web@0.2.0'
  - '@hoardodile/ui@0.2.0'
  - '@hoardodile/workbench@0.2.0'
  - '@effect/atom-react@4.0.0-rc.113'
  - '@effect/platform-browser@4.0.0-rc.113'
  - effect@4.0.0-rc.113
  - '@effect/vitest@4.0.0-rc.113'
